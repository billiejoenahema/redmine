services:
  redmine:
    image: redmine:7.0.2
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:3000:3000"
    user: "${LOCAL_UID}:${LOCAL_GID}"
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_PORT: 5432
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine_local_password
      REDMINE_SECRET_KEY_BASE: change-this-to-a-long-random-string
      REDMINE_PLUGINS_MIGRATE: "1"
    volumes:
      - ./redmine-plugin/redmine_worktime:/usr/src/redmine/plugins/redmine_worktime
      - redmine-files:/usr/src/redmine/files

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine_local_password
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redmine-files:
  postgres-data:
